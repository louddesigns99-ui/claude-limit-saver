name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: cd skills && zip -r ../limit-saver.zip limit-saver
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: limit-saver.zip
          generate_release_notes: true
          body: |
            **Install the skill:** download `limit-saver.zip` below and upload it as a skill in Claude's settings (claude.ai), or copy `skills/limit-saver` into `~/.claude/skills/` (Claude Code).
            **Always-on rules:** paste `skills/limit-saver/rules/PROJECT-INSTRUCTIONS.md` into your project instructions.
